# Coverage config for scripts/testing/compare_coverage.sh --profile system
#
# Exclude tests from measured source. The target itself is `system`, so without
# this omit list test files inside system/tests/ appear in reports.

[run]
omit =
    */system/tests/*
    */openpilot/system/tests/*
    */system/*/tests/*
    */openpilot/system/*/tests/*
    */system/**/tests/*
    */openpilot/system/**/tests/*

[report]
omit =
    */system/tests/*
    */openpilot/system/tests/*
    */system/*/tests/*
    */openpilot/system/*/tests/*
    */system/**/tests/*
    */openpilot/system/**/tests/*
skip_empty = true
