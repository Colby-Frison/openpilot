# Coverage config for scripts/testing/compare_coverage.sh --profile pandad
#
# Keep reports focused on pandad implementation files by omitting test modules.

[run]
omit =
    */selfdrive/pandad/tests/*
    */openpilot/selfdrive/pandad/tests/*

[report]
omit =
    */selfdrive/pandad/tests/*
    */openpilot/selfdrive/pandad/tests/*
skip_empty = true
