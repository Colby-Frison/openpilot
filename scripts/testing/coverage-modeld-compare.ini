# Used only by scripts/testing/compare_coverage.sh (pytest --cov-config=...).
#
# - Omit ``selfdrive/modeld/tests/`` so test modules are not traced as product
#   code. The compare script runs pytest with ``-n 0`` for stable cov combine.
# - ``modeld.py`` / ``dmonitoringmodeld.py`` are **included** when
#   ``test_modeld_package_surfaces.py`` runs (import + pure helpers); omit only
#   the tests tree so HTML reflects production files.

[run]
omit =
    */selfdrive/modeld/tests/*
    */openpilot/selfdrive/modeld/tests/*

[report]
omit =
    */selfdrive/modeld/tests/*
    */openpilot/selfdrive/modeld/tests/*
skip_empty = true
